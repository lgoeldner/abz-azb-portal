name: abizeitung-portal

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  portal:
    build:
      context: ./deployables/portal
    image: abizeitung-portal:${APP_VERSION:-local}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["portal migrate && exec portal serve"]
    environment:
      APP_ENV: production
      ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-portal}?sslmode=disable
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to the HTTPS site URL}
      AUTH_MODE: better_auth
      AUTH_INTERNAL_URL: http://auth:3000
      AUTH_SERVICE_SECRET: ${AUTH_SERVICE_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      UPLOAD_DIR: /var/lib/portal/uploads
      STATIC_DIR: /app/static
      BACKUP_STATUS_FILE: /var/lib/portal/status/status.json
      MAIL_PROVIDER: ${MAIL_PROVIDER:-brevo}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_TRACKING_DISABLED: ${BREVO_TRACKING_DISABLED:-false}
      MAIL_LOGIN_RESERVE: ${MAIL_LOGIN_RESERVE:-150}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-300}
      REMINDER_DAILY_LIMIT: ${REMINDER_DAILY_LIMIT:-150}
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-false}
    volumes:
      - uploads:/var/lib/portal/uploads
      - backup_status:/var/lib/portal/status:ro
    depends_on:
      db: { condition: service_healthy }
      auth: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      start_period: 60s
      retries: 10
    expose: ["8080"]
    networks: [internal, egress]

  auth:
    build:
      context: ./deployables/auth
    image: abizeitung-auth:${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      APP_ENV: production
      AUTH_MODE: better_auth
      DATABASE_URL: postgres://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-portal}?sslmode=disable
      AUTH_SERVICE_SECRET: ${AUTH_SERVICE_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${PUBLIC_URL:?Set PUBLIC_URL to the HTTPS site URL}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      PORTAL_INTERNAL_URL: http://portal:8080
      PORT: "3000"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      start_period: 20s
      retries: 20
    expose: ["3000"]
    networks: [internal, egress]

  reminders:
    image: abizeitung-portal:${APP_VERSION:-local}
    build:
      context: ./deployables/portal
    restart: unless-stopped
    profiles: [reminders]
    command: ["reminders"]
    environment:
      APP_ENV: production
      ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-portal}?sslmode=disable
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to the HTTPS site URL}
      AUTH_MODE: better_auth
      AUTH_INTERNAL_URL: http://auth:3000
      AUTH_SERVICE_SECRET: ${AUTH_SERVICE_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      UPLOAD_DIR: /var/lib/portal/uploads
      STATIC_DIR: /app/static
      MAIL_PROVIDER: ${MAIL_PROVIDER:-brevo}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_TRACKING_DISABLED: ${BREVO_TRACKING_DISABLED:-false}
      MAIL_LOGIN_RESERVE: ${MAIL_LOGIN_RESERVE:-150}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-300}
      REMINDER_DAILY_LIMIT: ${REMINDER_DAILY_LIMIT:-150}
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-false}
    depends_on:
      db: { condition: service_healthy }
      auth: { condition: service_healthy }
      portal: { condition: service_healthy }
    networks: [internal, egress]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    profiles: [production]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST to the public DNS name}
      AUTH_SERVICE_SECRET: ${AUTH_SERVICE_SECRET:-}
    volumes:
      - ./deployables/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      portal: { condition: service_healthy }
    networks: [internal, egress]

  backup:
    build:
      context: ./deployables/backup
    image: abizeitung-portal-backup:${APP_VERSION:-local}
    restart: unless-stopped
    profiles: [production]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-portal}
      PGUSER: ${POSTGRES_USER:-portal}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set an independent S3 or REST repository}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD}
      APP_VERSION: ${APP_VERSION:-local}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-central-1}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:?Set an external heartbeat URL}
      BACKUP_STATUS_FILE: /status/status.json
      UPLOAD_DIR: /uploads
      PGSSLMODE: ${BACKUP_PGSSLMODE:-disable}
    volumes:
      - uploads:/uploads:ro
      - backup_status:/status
    depends_on:
      db: { condition: service_healthy }
    networks: [internal, egress]

volumes:
  postgres_data:
  uploads:
  backup_status:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  egress:
