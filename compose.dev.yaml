services:
  auth:
    restart: unless-stopped
    build:
      context: ./deployables/auth
      target: development-mock
    environment:
      APP_ENV: development
      AUTH_MODE: mock
      DATABASE_URL: postgres://portal:portal-dev@db:5432/portal?sslmode=disable
      AUTH_SERVICE_SECRET: dev-only-service-secret-at-least-32-bytes
      MOCK_AUTH_SECRET: dev-only-mock-secret-at-least-32-bytes
      BETTER_AUTH_URL: ${PUBLIC_URL:-https://localhost}
      PORTAL_INTERNAL_URL: http://portal:8080
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [internal, egress]

  db:
    environment:
      POSTGRES_PASSWORD: portal-dev
    ports:
      - "127.0.0.1:5432:5432"
    networks: [internal, egress]

  portal:
    build:
      context: ./deployables/portal
    entrypoint: ["/bin/sh", "-c"]
    command: ["portal migrate && portal seed && exec portal serve"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://portal:portal-dev@db:5432/portal?sslmode=disable
      AUTH_MODE: mock
      AUTH_INTERNAL_URL: http://auth:3000
      AUTH_SERVICE_SECRET: dev-only-service-secret-at-least-32-bytes
      SESSION_SECRET: development-only-secret-change-for-production
      MAIL_PROVIDER: capture
      REMINDERS_ENABLED: "false"
      UPLOAD_DIR: /var/lib/portal/uploads
      STATIC_DIR: /app/static
      BACKUP_STATUS_FILE: /var/lib/portal/status/status.json
    # Reached through caddy; leaves 8080 free for optional host Go development.
    volumes:
      - ./deployables/portal/server/data/uploads:/var/lib/portal/uploads
      - backup_status:/var/lib/portal/status:ro
    depends_on:
      auth: { condition: service_healthy }

  frontend:
    restart: unless-stopped
    build:
      context: ./deployables/portal
      target: web-dev
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./deployables/portal/web:/src/web
      - /src/web/node_modules
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [internal]

  caddy:
    environment:
      AUTH_SERVICE_SECRET: dev-only-service-secret-at-least-32-bytes
    ports: !override
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:443:443/udp"
    volumes:
      - ./deployables/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      portal: { condition: service_started }
      frontend: { condition: service_healthy }

  backup:
    entrypoint: ["/bin/sh", "-c", "restic cat config >/dev/null 2>&1 || restic init; exec /usr/local/bin/backup.sh"]
    volumes:
      - ./deployables/portal/server/data/uploads:/uploads:ro
      - restic_dev:/restic

volumes:
  restic_dev:
