services:
  auth-mock:
    restart: unless-stopped
    build:
      context: ./deployables/auth-mock
    environment:
      APP_ENV: development
      ADDR: :9090
      OIDC_ISSUER: http://localhost:9090
      OIDC_CLIENT_ID: portal-dev
      OIDC_CLIENT_SECRET: dev-only
      AUTH_MOCK_USERS: /config/users.yaml
      AUTH_MOCK_REDIRECT_URIS: http://localhost:5173/auth/callback,http://localhost:8080/auth/callback,http://127.0.0.1:8080/auth/callback,${PUBLIC_URL}/auth/callback
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deployables/auth-mock/users.yaml:/config/users.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [internal, egress]

  db:
    environment:
      POSTGRES_PASSWORD: portal-dev
    ports:
      - "127.0.0.1:5432:5432"
    networks: [internal, egress]

  portal:
    build:
      context: ./deployables/portal
    entrypoint: ["/bin/sh", "-c"]
    command: ["portal migrate && portal seed && exec portal serve"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://portal:portal-dev@db:5432/portal?sslmode=disable
      AUTH_MODE: mock
      OIDC_ISSUER: http://localhost:9090
      OIDC_BACKCHANNEL_URL: http://auth-mock:9090
      OIDC_CLIENT_ID: portal-dev
      OIDC_CLIENT_SECRET: dev-only
      SESSION_SECRET: development-only-secret-change-for-production
      UPLOAD_DIR: /var/lib/portal/uploads
      STATIC_DIR: /app/static
      BACKUP_STATUS_FILE: /var/lib/portal/status/status.json
    # Reached through caddy; leaves 8080 free for optional host Go development.
    volumes:
      - ./deployables/portal/server/data/uploads:/var/lib/portal/uploads
      - backup_status:/var/lib/portal/status:ro
    depends_on:
      auth-mock: { condition: service_healthy }

  frontend:
    restart: unless-stopped
    build:
      context: ./deployables/portal
      target: web-dev
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./deployables/portal/web:/src/web
      - /src/web/node_modules
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [internal]

  caddy:
    ports: !override
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:443:443/udp"
    volumes:
      - ./deployables/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      portal: { condition: service_started }
      frontend: { condition: service_healthy }

  backup:
    entrypoint: ["/bin/sh", "-c", "restic cat config >/dev/null 2>&1 || restic init; exec /usr/local/bin/backup.sh"]
    volumes:
      - ./deployables/portal/server/data/uploads:/uploads:ro
      - restic_dev:/restic

volumes:
  restic_dev:
