# GitHub "Images" workflow finished -> signed POST -> edge /hooks/* -> this listener -> start the update service.
# The "Preview" workflow has its own hook id and GitHub webhook (/hooks/preview) and starts the preview sync instead.
# The timer stays as an hourly fallback: deliveries made while the server is offline are lost.
# Upstream release, pinned by checksum: Fedora has no webhook package.
- name: Webhook release
  ansible.builtin.get_url:
    url: "https://github.com/adnanh/webhook/releases/download/{{ webhook_version }}/webhook-linux-{{ webhook_arch }}.tar.gz"
    dest: "{{ webhook_dir }}.tar.gz"
    checksum: "sha256:{{ webhook_sha256[webhook_arch] }}"
    mode: "0644"

- name: Webhook directory
  ansible.builtin.file:
    path: "{{ webhook_dir }}"
    state: directory
    mode: "0755"

- name: Webhook binary
  ansible.builtin.unarchive:
    src: "{{ webhook_dir }}.tar.gz"
    dest: "{{ webhook_dir }}"
    remote_src: true
    creates: "{{ webhook_bin }}"
  notify: Restart webhook

- name: Webhook system user
  ansible.builtin.user:
    name: webhook
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Webhook config directory
  ansible.builtin.file:
    path: /etc/webhook
    state: directory
    mode: "0755"

# Contains the secret: readable by root and the service user only.
- name: Webhook hooks file
  ansible.builtin.template:
    src: webhook-hooks.json.j2
    dest: /etc/webhook/hooks.json
    owner: root
    group: webhook
    mode: "0640"
  no_log: true
  notify: Restart webhook

- name: Webhook may start the update and preview sync services, nothing else
  ansible.builtin.copy:
    dest: /etc/sudoers.d/abizeitbetrug-webhook
    content: |
      # Managed by Ansible.
      webhook ALL=(root) NOPASSWD: /usr/bin/systemctl start --no-block abizeitbetrug-test-update.service
      {{ 'webhook ALL=(root) NOPASSWD: /usr/bin/systemctl start --no-block abizeitbetrug-preview-sync.service' if test_preview_enabled else '' }}
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

# No NoNewPrivileges: the hook needs sudo.
- name: Webhook unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/abizeitbetrug-webhook.service
    content: |
      [Unit]
      Description=GitHub deploy webhook (reached through the reverse SSH tunnel)
      After=network-online.target
      Wants=network-online.target
      ConditionPathExists=/etc/webhook/hooks.json

      [Service]
      User=webhook
      Group=webhook
      ExecStart={{ webhook_bin }} -nopanic -hooks /etc/webhook/hooks.json -ip 127.0.0.1 -port {{ test_webhook_port }} -urlprefix hooks
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify:
    - Reload systemd
    - Restart webhook

- name: Flush handlers before starting the webhook
  ansible.builtin.meta: flush_handlers

- name: Webhook running
  ansible.builtin.service:
    name: abizeitbetrug-webhook
    state: started
    enabled: true

- name: GitHub webhooks
  ansible.builtin.include_tasks: github_webhook.yml
  loop: "{{ ['deploy'] + (['preview'] if test_preview_enabled else []) }}"
  loop_control:
    loop_var: hook
