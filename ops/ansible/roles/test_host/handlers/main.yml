- name: Restart webhook
  ansible.builtin.service:
    name: abizeitbetrug-webhook
    state: restarted

# Fire and forget: when Ansible itself runs through the tunnel, the restart cuts its connection.
- name: Restart tunnel
  ansible.builtin.command: systemctl restart abizeitbetrug-tunnel.service
  async: 30
  poll: 0
  changed_when: true

- name: Restart test caddy
  ansible.builtin.command: docker compose restart caddy
  args:
    chdir: "{{ test_dir }}"
  changed_when: true
  failed_when: false # first run: the stack does not exist yet

- name: Recreate test stack
  ansible.builtin.command: docker compose up -d --force-recreate --remove-orphans
  args:
    chdir: "{{ test_dir }}"
  changed_when: true
  failed_when: false # first run: images may not be there yet; "Stack running" reports real failures
