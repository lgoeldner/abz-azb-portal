# A dead tunnel session must free its listeners fast, or the reconnect fails (ExitOnForwardFailure).
- name: Drop dead SSH sessions
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/20-tunnel.conf
    content: |
      ClientAliveInterval 15
      ClientAliveCountMax 4
    mode: "0644"
  notify: Restart edge ssh

- name: OCI image firewall
  ansible.builtin.stat:
    path: /etc/iptables/rules.v4
  register: oci_rules

# The OCI image rejects everything but 22. ponytail: persisted only; on a fresh VM also add the live rule once (README).
- name: HTTP(S) survives reboots in the OCI image firewall
  ansible.builtin.lineinfile:
    path: /etc/iptables/rules.v4
    line: -A INPUT -p tcp -m state --state NEW -m multiport --dports 80,443 -j ACCEPT
    insertbefore: '^-A INPUT -j REJECT'
  when: oci_rules.stat.exists

- name: Edge directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: [/opt/edge, /opt/edge/caddy]

# The directory, not the file, is mounted: templating replaces the inode, a file mount would keep the old one.
- name: Edge Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/edge/caddy/Caddyfile
    mode: "0644"
  notify: Reload edge caddy

- name: Edge compose file
  ansible.builtin.copy:
    src: compose.yaml
    dest: /opt/edge/compose.yaml
    mode: "0644"

- name: Edge caddy running
  ansible.builtin.command: docker compose up -d
  args:
    chdir: /opt/edge
  register: edge_up
  changed_when: "'Started' in edge_up.stderr or 'Recreated' in edge_up.stderr"
