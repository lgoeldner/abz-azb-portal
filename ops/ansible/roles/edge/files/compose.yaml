# Edge reverse proxy: TLS for every site, forwarded into the reverse SSH tunnel. Host network reaches its loopback listeners.
name: edge
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  caddy_data:
  caddy_config:
