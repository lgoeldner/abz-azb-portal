# Generate: openssl rand -hex 32.
# The edge vault (group_vars/edge/vault.yml) holds one key, the shared PR preview password as a bcrypt hash:
#   vault_edge_preview_basic_auth_hash: "$2a$14$..."  # caddy hash-password (README, "Preview deployments")

