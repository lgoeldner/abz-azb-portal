# deploy is a jump host only: no shell, forwards only to the tunnel's ssh port. sshd has no "listen nowhere"
# option, so permitlisten pins remote forwards to that port too (squatting it fails the host key check).
deploy_key_options: 'restrict,port-forwarding,command="/bin/false",permitopen="127.0.0.1:{{ tunnel_ssh_port }}",permitlisten="127.0.0.1:{{ tunnel_ssh_port }}"'

# Also open these in the OCI VCN security list.
ufw_allow:
  - { port: "80", proto: tcp }
  - { port: "443", proto: tcp }
  - { port: "443", proto: udp }

edge_acme_email: "test@abizeitbetrug.de"
edge_tls_internal: false # true only for local tests without public DNS
edge_static_hosts: [abizeitbetrug.de, www.abizeitbetrug.de] # "under construction" page; drop once production is served here
edge_sites:
  - host: test.abizeitbetrug.de
    upstream: "127.0.0.1:{{ tunnel_http_port }}"
    hooks_upstream: "127.0.0.1:{{ tunnel_hooks_port }}" # optional: /hooks/* goes here (deploy webhook)
