wg_address: "{{ wg_edge_address }}"
wg_private_key: "{{ vault_wg_private_key }}"
wg_listen_port: "{{ wg_port }}"
wg_peers:
  - public_key: "{{ wg_test_public_key }}"
    allowed_ips: "{{ wg_test_address }}/32"

wg_test_public_key: CHANGE_ME # wg pubkey of the test server's vault_wg_private_key

# Also open these in the OCI VCN security list.
ufw_allow:
  - { port: "80", proto: tcp }
  - { port: "443", proto: tcp }
  - { port: "443", proto: udp }
  - { port: "{{ wg_port }}", proto: udp }

edge_acme_email: ""
edge_tls_internal: false # true only for local tests without public DNS
edge_sites:
  - host: test.abizeitbetrug.de
    upstream: "{{ wg_test_address }}:80"
