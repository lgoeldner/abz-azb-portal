# Reverse SSH tunnel: the test host dials deploy@edge and listens on the edge's loopback.
tunnel_ssh_port: 2222 # test host sshd, the jump target
tunnel_http_port: 8081 # test Caddy (8082 is already taken on the OCI VM)
tunnel_hooks_port: 9000 # deploy webhook listener
# PR previews use their own tunnel unit and key, so a failed preview forward cannot drop test, hooks or ssh.
tunnel_preview_http_port: 8083 # preview Caddy (free on the OCI VM; check before changing)
tunnel_preview_ask_port: 8084 # preview Caddy "ask" for on-demand certificates

# Public keys for the deploy user. Test host: deploy has sudo, Ansible logs in as deploy.
# Edge: deploy_key_options limits every key to jumping to the tunnel's ssh port.
# Password SSH is switched off only when this is non-empty.
deploy_ssh_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEgEJUv1mGn1RCL33FDCqPN8W91hh9/qTngwirBV1gFV azb-ci

deploy_key_options: ""

# Firewall: off until checked per host (OCI images ship their own iptables rules).
manage_ufw: false
ufw_allow: []

# Weekly OS updates on every host (systemd calendar syntax; the timezone suffix pins Berlin time).
auto_update_calendar: "Tue *-*-* 04:30:00 Europe/Berlin"
auto_update_timers: "{{ [{'unit': 'apt-daily.timer', 'calendar': auto_update_calendar_early}, {'unit': 'apt-daily-upgrade.timer', 'calendar': auto_update_calendar}] if ansible_facts['os_family'] == 'Debian' else [{'unit': 'dnf5-automatic.timer', 'calendar': auto_update_calendar}] }}"
auto_update_calendar_early: "Tue *-*-* 04:25:00 Europe/Berlin"
