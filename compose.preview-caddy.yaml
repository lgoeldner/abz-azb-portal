# Routes <slug>.test.abizeitbetrug.de to the running previews. Holds no secrets and no access to the test stack.
# The sync script generates caddy/Caddyfile (one block per live preview) and reloads it.
# :8080 is the site (reached via the edge's reverse SSH tunnel); :8081 answers only the edge's on-demand TLS "ask".
name: preview-caddy
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    # The caddy binary carries a file capability (cap_net_bind_service); without it in the bounding set exec fails.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    ports:
      - "127.0.0.1:${PREVIEW_HTTP_PORT:?}:8080"
      - "127.0.0.1:${PREVIEW_ASK_PORT:?}:8081"
    volumes:
      # The directory, not the file: the sync replaces the file's inode.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
    # A published port needs a routable network; the internal preview network is what reaches the portals.
    networks: [outside, preview]
volumes:
  caddy_data:
  caddy_config:
networks:
  outside:
  preview:
    external: true
    name: preview
