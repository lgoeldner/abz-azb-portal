name: CI

on:
  # dont reenable without perms
  #push: # every branch
  pull_request:
  #schedule:
  #  - cron: '17 5 * * 1' # weekly, so new advisories surface without a push
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: deployables/portal/server/go.mod
          cache-dependency-path: |
            deployables/portal/server/go.sum
            deployables/auth-mock/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            deployables/auth/package-lock.json
            deployables/portal/web/package-lock.json
      - name: Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: goinstall # built with go.mod's Go, so new language versions never break the linter
          working-directory: deployables/portal/server
      - name: Go lint (auth-mock)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: goinstall
          working-directory: deployables/auth-mock
      - name: Shell lint
        run: shellcheck -S warning scripts/*.sh deployables/backup/*.sh deployables/portal/entrypoint.sh
      - name: Auth service checks
        run: cd deployables/auth && npm ci && npm run check
      - name: Frontend lint and types
        run: cd deployables/portal/web && npm ci && npm run lint && npm run typecheck
      - name: API contract
        run: node scripts/check-contract.mjs
      - name: Repo map paths exist
        run: bash scripts/check-repo-map.sh

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: deployables/portal/server/go.mod
          cache-dependency-path: |
            deployables/portal/server/go.sum
            deployables/auth-mock/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Go vulnerabilities reachable from our code (incl. standard library)
        run: |
          cd deployables/portal/server && go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          cd ../../auth-mock && go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: npm advisories
        run: |
          cd deployables/auth && npm ci && npm audit --omit=dev --audit-level=high
          cd ../portal/web && npm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: portal_test
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U portal -d portal_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: deployables/portal/server/go.mod
          cache-dependency-path: |
            deployables/portal/server/go.sum
            deployables/auth-mock/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            deployables/auth/package-lock.json
            deployables/portal/web/package-lock.json
      - name: Go tests and vet
        env:
          TEST_DATABASE_URL: postgres://portal:portal_test@localhost:5432/portal_test?sslmode=disable
        run: |
          cd deployables/portal/server && go test -race ./... && go vet ./...
          cd ../../auth-mock && go test -race ./... && go vet ./...
      - name: Frontend tests and production build
        run: cd deployables/portal/web && npm ci && npm test -- --run && npm run build
      - name: Auth dependency integration invariants
        env:
          TEST_DATABASE_URL: postgres://portal:portal_test@localhost:5432/portal_test?sslmode=disable
          TEST_DATABASE_DISPOSABLE: "YES"
        run: cd deployables/auth && npm ci && npm run check
      - name: Ops shell and restore safety checks
        run: |
          bash deployables/backup/test-backup-lock.sh
          bash deployables/backup/test-restore-safety.sh
      - name: Start migrated and seeded app
        env:
          APP_ENV: development
          ADDR: :8080
          DATABASE_URL: postgres://portal:portal_test@localhost:5432/portal_test?sslmode=disable
          PUBLIC_URL: http://127.0.0.1:8080
          AUTH_MODE: mock
          AUTH_INTERNAL_URL: http://127.0.0.1:3000
          AUTH_SERVICE_SECRET: ci-service-secret-at-least-32-bytes
          MOCK_AUTH_SECRET: ci-mock-secret-at-least-32-bytes
          BETTER_AUTH_URL: http://127.0.0.1:8080
          PORTAL_INTERNAL_URL: http://127.0.0.1:8080
          SESSION_SECRET: ci-only-secret-at-least-32-bytes-long
          MAIL_PROVIDER: capture
          REMINDERS_ENABLED: "false"
          UPLOAD_DIR: /tmp/portal-uploads
          STATIC_DIR: ${{ github.workspace }}/deployables/portal/web/dist
          BACKUP_STATUS_FILE: /tmp/portal-backup-status.json
        run: |
          mkdir -p /tmp/portal-uploads
          (cd deployables/portal/server && go build -o /tmp/portal ./cmd/portal)
          /tmp/portal migrate
          /tmp/portal seed
          (cd deployables/auth && APP_ENV=development AUTH_MODE=mock AUTH_SERVICE_SECRET="$AUTH_SERVICE_SECRET" MOCK_AUTH_SECRET="$MOCK_AUTH_SECRET" DATABASE_URL="$DATABASE_URL" BETTER_AUTH_URL="$BETTER_AUTH_URL" PORTAL_INTERNAL_URL="$PORTAL_INTERNAL_URL" PORT=3000 npm run start:mock) >/tmp/auth.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/healthz
          /tmp/portal serve >/tmp/portal.log 2>&1 &
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/readyz && exit 0
            sleep 1
          done
          cat /tmp/portal.log
          exit 1
      # No browser download: the runner's preinstalled Google Chrome is used. The suite asserts
      # behaviour and layout invariants (no overflow, no page crash), not pixel snapshots.
      - name: Browser journeys and layout checks
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          PLAYWRIGHT_CHANNEL: chrome
          DEBUG_EXPECT_PRODUCTION: "1"
        run: cd deployables/portal/web && npm run test:e2e
      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: deployables/portal/web/test-results/
          retention-days: 7
      - name: App logs
        if: failure()
        run: cat /tmp/portal.log

  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Disposable container backup and restore drill
        env:
          DOCKER_CONTEXT: default
        run: bash scripts/test-recovery.sh
