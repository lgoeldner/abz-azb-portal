name: Preview

# Builds the preview images of a same-repo pull request. The home server's sync (ops/ansible, test_host) deploys them
# to <branch-slug>.test.abizeitbetrug.de and deletes them again; the "Preview" workflow_run webhook wakes it.
# Plain pull_request on purpose: forks get no token and no preview, and a user with write access could run
# any workflow anyway. The image names are separate from the production ones so their cache and packages are too.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_DOMAIN: test.abizeitbetrug.de

jobs:
  build:
    # Same repo only (needs push access), no drafts, no bots.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Preview name
        id: slug
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if slug=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" | jq -s 'add' | bash scripts/preview-slug.sh "$BRANCH" "$NUMBER" 2>err.txt); then
            echo "slug=$slug" >>"$GITHUB_OUTPUT"
          else
            echo "reason=$(cat err.txt)" >>"$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.slug.outputs.slug
      - uses: docker/login-action@v3
        if: steps.slug.outputs.slug
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Two images the home server pulls anonymously: set both packages public once (README, "Preview deployments").
      - uses: docker/build-push-action@v6
        if: steps.slug.outputs.slug
        with:
          context: deployables/portal
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/abizeitung-portal-preview:${{ github.event.pull_request.head.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=preview-abizeitung-portal
          cache-to: type=gha,mode=max,scope=preview-abizeitung-portal
      - uses: docker/build-push-action@v6
        if: steps.slug.outputs.slug
        with:
          context: deployables/auth
          target: development-mock
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/abizeitung-auth-preview:${{ github.event.pull_request.head.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=preview-abizeitung-auth
          cache-to: type=gha,mode=max,scope=preview-abizeitung-auth
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SLUG: ${{ steps.slug.outputs.slug }}
          REASON: ${{ steps.slug.outputs.reason }}
        run: |
          marker='<!-- azb-preview -->'
          if [ -n "$SLUG" ]; then
            body="$marker
          **Preview:** https://$SLUG.$PREVIEW_DOMAIN (commit \`${SHA::7}\`)

          Fresh database with fixture data and mock login on every push. It appears within a few minutes and is removed 3 days after the last push or when the PR closes. Behind the shared preview password; ask a maintainer."
          else
            body="$marker
          **No preview:** $REASON. Rename the branch to get one."
          fi
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -f body="$body" >/dev/null
          fi
